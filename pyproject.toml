# ManiSkill 3 demo generation (motion planning -> rgb + state -> teammate-ready HDF5).
# Environment of the ubuntu expert machine that produced and verified the 9.25 smoke data
# (dp-manip environment/ubuntu-expert-freeze.txt), with torch as the CPU build: generation
# runs PhysX on the CPU and renders through Vulkan, it never uses CUDA.
#
#   ./setup.sh        # uv sync --frozen + the mplib 0.2.1 patch for mani_skill
#
# Linux x86_64 only: mplib has no wheels elsewhere.

[project]
name = "maniskill-demogen"
version = "0.1.0"
description = "Generate ManiSkill 3 motion-planning demos with rgb and state observations, one task per job"
requires-python = "==3.11.*"
dependencies = [
    "mani-skill==3.0.1",
    "sapien==3.0.3",
    "mplib==0.2.1",
    "gymnasium==1.3.0",
    "numpy==1.26.4",
    "h5py==3.16.0",
    "torch==2.14.0",
    # mani-skill depends on opencv-python, which needs libGL.so.1; cluster login nodes have
    # none (and no sudo). The headless build has the same API without GUI functions.
    "opencv-python-headless==4.11.0.86",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# mani-skill 3.0.1 pins mplib==0.1.1, which crashes when the Panda planner starts;
# 0.2.1 works with patches/mani_skill_mplib_0_2_1.patch (applied by setup.sh).
override-dependencies = ["mplib==0.2.1", "opencv-python; sys_platform == 'never'"]
# setup.sh patches a file inside .venv; with copies the patch cannot reach uv's cache.
link-mode = "copy"
# The rest of the verified ubuntu environment (CUDA-only packages left out).
constraint-dependencies = [
    "absl-py==2.5.0", "anyio==4.15.1", "arm-pytorch-utilities==0.5.0", "asttokens==3.0.2",
    "certifi==2026.7.22", "charset-normalizer==3.5.1", "click==8.5.0", "cloudpickle==3.1.2",
    "contourpy==1.3.3", "cycler==0.12.1", "dacite==1.9.2", "defusedxml==0.7.1",
    "docstring-parser==0.18.0", "executing==2.2.1", "farama-notifications==0.0.6",
    "filelock==4.0.1", "fonttools==4.65.0", "fsspec==2026.9.0", "gitdb==4.0.12",
    "gitpython==3.1.62", "h11==0.16.0", "hf-xet==1.6.0", "httpcore==1.0.9", "httpx==0.28.1",
    "huggingface-hub==1.32.0", "idna==3.20", "imageio==2.37.4", "imageio-ffmpeg==0.6.0",
    "importlib-resources==7.1.0", "ipython==9.17.1", "ipython-pygments-lexers==1.1.1",
    "jedi==0.20.0", "jinja2==3.1.6", "kiwisolver==1.5.1", "lxml==6.1.3", "markupsafe==3.0.3",
    "matplotlib==3.11.2", "matplotlib-inline==0.2.2", "mpmath==1.3.0", "networkx==3.6.1",
    "packaging==26.3", "parso==0.8.7", "pexpect==4.9.0",
    "pillow==12.3.0", "prompt-toolkit==3.0.53", "psutil==7.2.2", "ptyprocess==0.7.0",
    "pure-eval==0.2.4", "pygments==2.21.0", "pyparsing==3.3.3", "pyperclip==1.11.0",
    "python-dateutil==2.9.0.post0", "pytorch-kinematics==0.7.6", "pytorch-seed==0.2.0",
    "pyyaml==6.0.3", "requests==2.34.2", "scipy==1.17.1", "setuptools==84.0.0", "six==1.17.0",
    "smmap==5.0.3", "stack-data==0.6.3", "sympy==1.14.0", "tabulate==0.10.0", "toppra==0.6.10",
    "tqdm==4.70.1", "traitlets==5.16.1", "transforms3d==0.4.2", "trimesh==5.1.0",
    "typeguard==4.6.0", "typing-extensions==4.16.0", "tyro==1.0.16", "urllib3==2.8.0",
    "wcwidth==0.8.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
